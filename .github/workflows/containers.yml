name: ROS2 runtime images
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/autolab-fi/ondroid-ros2-runtime:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/autolab-fi/ondroid-ros2-runtime
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.service
          platforms: linux/amd64
          push: true
          tags: ghcr.io/autolab-fi/ondroid-ros2-service:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/autolab-fi/ondroid-ros2-runtime
